name: 'Tests'

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  checks: write

jobs:
  test:
    name: 'Test (${{ matrix.name }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'JVM'
            os: ubuntu-latest
            gradle-task: jvmTest
            cache-group: jvm
            needs-libcurl: false
          - name: 'Linux'
            os: ubuntu-latest
            gradle-task: linuxX64Test
            cache-group: linux
            needs-libcurl: true
          - name: 'Darwin ARM'
            os: macos-latest
            gradle-task: macosArm64Test
            cache-group: darwin
            needs-libcurl: false
          - name: 'Darwin x64'
            os: macos-15-intel
            gradle-task: macosX64Test
            cache-group: darwin
            needs-libcurl: false
          - name: 'Mingw'
            os: windows-latest
            gradle-task: mingwX64Test
            cache-group: mingw
            needs-libcurl: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install libcurl
        if: matrix.needs-libcurl
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-gnutls-dev

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/jdks
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-caches-${{ matrix.cache-group }}-v0-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'libs.versions.toml') }}

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew.bat ${{ matrix.gradle-task }} --no-daemon
          else
            ./gradlew ${{ matrix.gradle-task }}
          fi

      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          check_name: '${{ matrix.name }} Test Reports'
          report_paths: '**/build/test-results/${{ matrix.gradle-task }}/TEST-*.xml'
